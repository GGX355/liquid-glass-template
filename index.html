<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Liquid Glass Template · 苹果液态玻璃演示</title>
<link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./liquid-glass.css"/>
<style>
  .wrap { position: relative; z-index: 2; max-width: 700px; margin: 0 auto; padding: 30px 20px 90px; }
  .panel { border-radius: var(--r-lg); padding: var(--sp-5); }
  h1 { margin-top: var(--sp-1); font-size: var(--fs-large-title); font-weight: 700; letter-spacing: -.4px; }
  .kicker { font-size: var(--fs-footnote); font-weight: 600; letter-spacing: .1em; color: var(--ink3); }
  .status { margin-top: 10px; font-size: var(--fs-subhead); color: var(--ink3); display: flex; align-items: center; gap: 8px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  /* 当前档位徽章 */
  .badge { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 50;
    font-size: var(--fs-caption); color: var(--ink2); background: var(--glass-bg);
    backdrop-filter: var(--glass-bf); -webkit-backdrop-filter: var(--glass-bf);
    border: 1px solid var(--glass-border); border-radius: var(--r-pill); padding: 5px 14px;
    box-shadow: var(--rim-sm); font-family: var(--font-sans); white-space: nowrap; }

  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    min-height: 176px; text-align: center; transition: min-height .4s ease; }
  .hero.island { min-height: 240px; }
  .hero .note { width: min(300px, 100%); }
  .fineprint { font-size: var(--fs-footnote); color: var(--ink4); }

  .sec-title { margin: 30px 0 12px; font-size: var(--fs-footnote); font-weight: 600; letter-spacing: .1em; color: var(--ink3); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; perspective: 900px; }
  @media (max-width: 560px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .draw-card { position: relative; height: 96px; display: grid; place-items: center; cursor: pointer;
    transform-style: preserve-3d; transition: opacity .4s, border-color .25s, box-shadow .25s;
    animation: rise .55s cubic-bezier(.22,1,.36,1) both; will-change: transform; }
  .draw-card.flipping { animation: none; transform: rotateY(180deg); cursor: default; }
  .draw-card.dim-fade { opacity: .38; }
  .draw-card.dim-blur { opacity: .5; filter: blur(2.5px); }
  .draw-card.dim-fadescale { opacity: .38; transform: scale(.94) !important; }
  .draw-card.rolling .dc-face.front { border-color: color-mix(in oklab, var(--accent) 55%, var(--glass-border));
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 18%, transparent), var(--rim-sm); }
  .dc-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: inherit;
    background: var(--glass-bg); backdrop-filter: var(--glass-bf); -webkit-backdrop-filter: var(--glass-bf);
    border: 1px solid var(--glass-border); box-shadow: var(--rim-sm); }
  .dc-face.back { transform: rotateY(180deg); background: var(--mover-bg); }
  .dc-face .lbl { font-size: var(--fs-headline); font-weight: 600; }
  .dc-face .win { font-size: var(--fs-caption); color: var(--ink3); }
  .dc-face .big { font-size: var(--fs-title); font-weight: 700;
    background: linear-gradient(120deg, var(--accent), var(--accent2) 60%, var(--accent3));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tip { text-align: center; margin-top: 14px; font-size: var(--fs-footnote); color: var(--ink4); }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .grow { position: relative; overflow: hidden; border-radius: var(--r-md); padding: 15px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .grow .fill { position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 16%, transparent), color-mix(in oklab, var(--accent2) 12%, transparent));
    transform-origin: left; transform: scaleX(var(--f, 0)); transition: transform .9s cubic-bezier(.22,1,.36,1); }
  .grow > span { position: relative; z-index: 1; }
  .grow .nm { font-size: var(--fs-headline); font-weight: 600; }
  .grow .ct { font-size: var(--fs-subhead); color: var(--ink3); font-variant-numeric: tabular-nums; }
  .admin { margin-top: 30px; padding: var(--sp-4); }
  .admin .chips { display: flex; flex-wrap: wrap; gap: 8px; font-size: var(--fs-caption); color: var(--ink3); }
  .admin .chips span { border: 1px solid var(--glass-border); border-radius: var(--r-pill); padding: 4px 10px;
    background: var(--glass-bg); backdrop-filter: var(--glass-bf); -webkit-backdrop-filter: var(--glass-bf);
    box-shadow: var(--rim-sm); }
  .reset { margin-top: 26px; text-align: center; }
  .reset button { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--ink2);
    font-size: var(--fs-subhead); cursor: pointer; border-radius: var(--r-pill); padding: 12px 24px; min-height: var(--touch); font-family: inherit; }
  .theme-btn { border: none; cursor: pointer; font-family: inherit;
    background: var(--mover-bg); box-shadow: var(--mover-shadow); color: var(--ink);
    font-size: var(--fs-subhead); font-weight: 600; border-radius: var(--r-pill); padding: 8px 14px;
    transition: transform .5s cubic-bezier(.28,1.7,.4,1); }
  .theme-btn:active { transform: scale(.92); transition-duration: .08s; }
  .other { text-align: center; margin-top: 14px; font-size: var(--fs-caption); color: var(--ink4); }
  .other a { color: var(--accent); text-decoration: none; margin: 0 4px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="lensFilter" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.010 0.010" numOctaves="2" seed="17" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="orbs"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i><i class="o5"></i></div>
<div class="grain"></div>
<div class="badge" id="badge"></div>

<div class="wrap">
  <nav class="nav glass" id="nav">
    <span class="navmover"></span>
    <span style="font-weight:800;font-size:17px;padding:0 14px 0 12px;position:relative;z-index:1">Pulse</span>
    <button class="lg-theme-btn theme-btn"></button>
  </nav>

  <p class="kicker">现场抽签 · 动画对比</p>
  <h1>周末值班选人</h1>
  <p class="status"><span class="dot"></span>盲选中 · 抽之前看不到人数和结果</p>

  <section class="glass panel hero" id="hero" style="margin-top:20px">
    <div class="lens-ring"><i></i></div>
    <div id="heroRoll" style="display:none;font-size:var(--fs-large-title);font-weight:700;letter-spacing:2px" class="dc-face big">一等奖</div>
    <input class="input note" placeholder="请填写姓名，随结果记名"/>
    <button class="btn" id="btnDraw">抽一次</button>
    <p class="fineprint">每人限抽一次 · 点下之前，谁抽到了什么一律保密</p>
  </section>

  <p class="sec-title">签位 · 全部保密中</p>
  <div class="cards" id="cards"></div>
  <p class="tip" id="tip"></p>

  <p class="sec-title">实时数据（仅发起人可见）</p>
  <section class="glass panel admin">
    <div class="lens-ring"><i></i></div>
    <div class="chips" id="chips"><span>0 人已参与</span><span>进行中</span></div>
    <div class="rows" style="margin-top:12px" id="rows"></div>
  </section>

  <div class="reset"><button onclick="location.reload()">↺ 重演一遍</button></div>
  <p class="other">其他档位：
    <a href="?v=1">① Snappy</a><a href="?v=2">② Smooth</a><a href="?v=3">③ Bouncy</a><a href="?v=4">④ Liquid</a><a href="?v=5">⑤ Island</a>
  </p>
</div>

<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;z-index:99"></canvas>
<script type="module">
  import { initTheme, initGlare, jelly, spring } from "./liquid-glass.js";
  initTheme();
  initGlare();

  /* ═══ 5 档动画配置：都映射到苹果 duration+bounce 弹簧模型 ══
     WWDC23：bounce 0=无过冲(.smooth)、0.45=脆弹(.snappy)、0.65=大果冻(.bouncy)
     ④=WWDC25 Liquid 的方向性形变  ⑤=灵动岛式面板 morph 揭晓 */
  const PROFILES = {
    "1": { name: "① Snappy 脆弹 · duration .35s / bounce .45",
      spring: { dur: 720, freq: 4.2, decay: 6.0 },
      flip: { dur: 520, ease: "cubic-bezier(.32,1.35,.4,1)" },
      rollInterval: 70, rollSteps: 12,
      dim: "dim-fade", heroReveal: "pop", hoverLift: true,
      confetti: 130, bgSpeed: 1.0 },
    "2": { name: "② Smooth 丝滑 · duration .55s / bounce 0",
      spring: { dur: 820, freq: 2.4, decay: 12 },
      flip: { dur: 700, ease: "cubic-bezier(.25,.7,.18,1)" },
      rollInterval: 105, rollSteps: 11,
      dim: "dim-blur", heroReveal: "fade", hoverLift: false,
      confetti: 70, bgSpeed: 0.6 },
    "3": { name: "③ Bouncy 大果冻 · duration .6s / bounce .65",
      spring: { dur: 1350, freq: 2.5, decay: 3.0 },
      flip: { dur: 1000, ease: "cubic-bezier(.25,1.55,.35,1)" },
      rollInterval: 55, rollSteps: 24,
      dim: "dim-fadescale", heroReveal: "pop", hoverLift: true,
      confetti: 220, bgSpeed: 1.5 },
    "4": { name: "④ Liquid 液滴形变 · WWDC25 directional stretch",
      spring: { dur: 1000, freq: 3.0, decay: 4.2 },
      flip: { dur: 900, ease: "cubic-bezier(.3,1.3,.4,1)", squash: true },
      rollInterval: 80, rollSteps: 15, stretchRoll: true, magneticHover: true,
      dim: "dim-fade", heroReveal: "morph",
      confetti: 150, bgSpeed: 1.2 },
    "5": { name: "⑤ Island 灵动岛揭晓 · panel morph",
      spring: { dur: 900, freq: 2.8, decay: 4.6 },
      flip: { dur: 700, ease: "cubic-bezier(.3,1.35,.4,1)" },
      rollInterval: 75, rollSteps: 16, heroRoll: true, panelMorph: true,
      dim: "dim-fade", heroReveal: "island",
      confetti: 180, bgSpeed: 1.0 },
  };

  const qs = new URLSearchParams(location.search);
  const pid = qs.get("v") && PROFILES[qs.get("v")] ? qs.get("v") : "2";
  const P = PROFILES[pid];
  document.getElementById("badge").textContent = "A 版动画 · " + P.name;
  document.title = "A 版动画 " + P.name.split("·")[0].trim();

  // 背景流速
  document.querySelectorAll(".orbs i").forEach((b, i) => {
    const d = parseFloat(getComputedStyle(b).animationDuration) * P.bgSpeed;
    b.style.animationDuration = d + "s";
  });

  // 弹簧包装（用当前档位参数）
  const elSpring = (el) => el && spring(el, 0.045, -0.045, P.spring);
  function flipAnim(el, my) {
    const sq = P.flip.squash;
    el.animate([
      { transform: "rotateY(0deg) scale(1)" },
      { transform: `rotateY(90deg) scale(${sq ? 1.1 : 1}, ${sq ? 0.9 : 1})`, offset: 0.5 },
      { transform: "rotateY(180deg) scale(1)" },
    ], { duration: P.flip.dur, easing: P.flip.ease });
  }

  /* ── 布局与状态 ── */
  const SLOTS = ["一等奖", "二等奖", "谢谢参与"];
  const cards = document.getElementById("cards");
  const hero = document.getElementById("hero");
  const tip = document.getElementById("tip");
  let done = false, timers = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
  const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id; };

  function build() {
    timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = [];
    done = false; cards.innerHTML = "";
    hero.classList.remove("island");
    tip.textContent = P.name;
    SLOTS.forEach((label, i) => {
      const u = document.createElement("div");
      u.className = "draw-card"; u.style.animationDelay = (i * 75) + "ms";
      u.innerHTML =
        '<div class="dc-face front"><span class="lbl">' + label + '</span></div>' +
        '<div class="dc-face back"><span class="win">你抽到了</span><span class="big">' + label + '</span></div>';
      if (P.hoverLift) u.addEventListener("pointerenter", () => { if (!done) elSpring(u); });
      cards.appendChild(u);
    });
    updateAdmin(0, 0, 0);
  }
  const units = () => [...cards.children];

  // 悬停磁吸（档位④）：卡朝指针微微偏移
  if (P.magneticHover) {
    cards.addEventListener("pointermove", e => {
      if (done) return;
      units().forEach(u => {
        const r = u.getBoundingClientRect();
        const dx = (e.clientX - (r.left + r.width / 2)) / r.width;
        u.style.transform = `translateX(${(dx * 6).toFixed(1)}px)`;
      });
    });
    cards.addEventListener("pointerleave", () => units().forEach(u => u.style.transform = ""));
  }

  function startDraw() {
    if (done) return; done = true;
    const heroIdle = hero.querySelectorAll(".note, .btn, .fineprint");
    heroIdle.forEach(el => el.style.visibility = "hidden");

    // ⑤ 灵动岛：hero 内文字快滚
    if (P.heroRoll) {
      const roll = document.getElementById("heroRoll");
      roll.style.display = "";
      let i = 0;
      every(() => { roll.textContent = SLOTS[i++ % SLOTS.length]; }, P.rollInterval);
    }

    const steps = P.rollSteps;
    let k = 0;
    every(() => {
      const u = units()[k % units().length];
      units().forEach(c => c.classList.remove("rolling"));
      u.classList.add("rolling");
      if (P.stretchRoll) {   // ④ 波形经过时水平拉伸（方向性形变）
        u.animate([
          { transform: "scaleX(1) scaleY(1)" },
          { transform: "scaleX(1.07) scaleY(.95)" },
          { transform: "scaleX(1) scaleY(1)" },
        ], { duration: P.rollInterval * 2.4, easing: "ease-out" });
      }
      k++;
      if (k >= steps) {
        timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = [];
        units().forEach(c => c.classList.remove("rolling"));
        land(0);
      }
    }, P.rollInterval);
  }

  function land(idx) {
    const u = units()[idx];
    const my = SLOTS[idx];
    u.classList.add("flipping");
    flipAnim(u);
    if (P.heroRoll) {
      document.getElementById("heroRoll").textContent = my;
    }
    later(() => {
      units().forEach((c, i) => { if (i !== idx) c.classList.add(P.dim); });
      heroReveal(my);
      if (idx === 0) burst(P.confetti);
      updateAdmin(1, 0, 0);
      tip.textContent = "结果已定 · 全场揭晓";
    }, P.flip.dur * 0.55);
  }

  function heroReveal(my) {
    const idle = hero.querySelectorAll(".note, .btn, .fineprint, #heroRoll");
    idle.forEach(el => el.style.visibility = "hidden");
    let box = hero.querySelector(".result");
    if (!box) {
      box = document.createElement("div");
      box.className = "result";
      box.innerHTML = '<p style="font-size:var(--fs-footnote);color:var(--ink3)">你抽到了</p>' +
        '<p class="dc-face big" id="bigLabel" style="font-size:var(--fs-title);font-weight:700">' + my + '</p>';
      hero.insertBefore(box, hero.querySelector(".fineprint"));
    } else {
      box.querySelector("#bigLabel").textContent = my;
      box.style.display = "";
    }
    const big = box.querySelector("#bigLabel");
    if (P.heroReveal === "pop") {
      big.animate([{ transform: "scale(.5)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1, offset: .7 }, { transform: "scale(1)" }], { duration: P.spring.dur * 0.6, easing: "ease-out" });
    } else if (P.heroReveal === "fade") {
      big.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: P.spring.dur * 0.8, easing: "ease-out" });
    } else if (P.heroReveal === "morph") {
      big.animate([
        { transform: "scale(.4,.6)", opacity: 0 },
        { transform: "scale(1.12,.94)", opacity: 1, offset: .55 },
        { transform: "scale(.97,1.03)", offset: .8 },
        { transform: "scale(1,1)" },
      ], { duration: P.spring.dur, easing: "linear" });
    } else if (P.heroReveal === "island") {
      hero.classList.add("island");
      big.animate([
        { transform: "scale(.3)", opacity: 0 },
        { transform: "scale(1.25)", opacity: 1, offset: .5 },
        { transform: "scale(.94)", offset: .78 },
        { transform: "scale(1)" },
      ], { duration: P.spring.dur, easing: "linear" });
      elSpring(hero);
    }
    elSpring(hero);
  }

  function updateAdmin(a, b, c) {
    const chips = document.getElementById("chips");
    chips.innerHTML = '<span>' + (1 + b + c) + ' 人已参与</span><span>进行中</span>';
    const rows = document.getElementById("rows");
    if (!rows.dataset.built) {
      const data = [["一等奖", 1], ["二等奖", 2], ["谢谢参与", 6]];
      data.forEach(([nm, ct], i) => {
        const r = document.createElement("div");
        r.className = "grow card"; r.style.animationDelay = (i * 60) + "ms";
        r.innerHTML = '<div class="fill"></div><span class="nm">' + nm + '</span><span class="ct">0/' + ct + '</span>';
        r.dataset.total = ct;
        rows.appendChild(r);
      });
      rows.dataset.built = "1";
    }
    rows.querySelectorAll(".grow").forEach((r, i) => {
      const taken = [a, b, c][i], total = +r.dataset.total;
      r.querySelector(".fill").style.setProperty("--f", taken / total);
      r.querySelector(".ct").textContent = taken + "/" + total;
      if (i === 0 && taken > 0 && !r.querySelector(".mine-tag")) {
        const t = document.createElement("span");
        t.className = "mine-tag";
        t.textContent = "我的签";
        t.style.cssText = "margin-left:8px;font-size:var(--fs-caption);color:var(--accent);font-weight:700";
        r.querySelector(".nm").appendChild(t);
      }
    });
  }

  document.getElementById("btnDraw").onclick = startDraw;

  function burst(n) {
    const colors = ["#0066ff", "#7d5aff", "#ff5f8f", "#ffb340", "#40c8b0"];
    const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
    cv.width = innerWidth; cv.height = innerHeight;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 8;
      parts.push({ x: cv.width / 2, y: cv.height * 0.4, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3,
        g: .17, r: 3 + Math.random() * 4, c: colors[i % colors.length], life: 1, decay: .011 + Math.random() * .01, rot: Math.random() * Math.PI });
    }
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = false;
      for (const p of parts) {
        if (p.life <= 0) continue; alive = true;
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.decay; p.rot += .08;
        ctx.save(); ctx.globalAlpha = Math.max(p.life, 0); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.7); ctx.restore();
      }
      if (alive && t - t0 < 3500) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, cv.width, cv.height);
    })(t0);
  }

  build();
</script>
</body>
</html>
